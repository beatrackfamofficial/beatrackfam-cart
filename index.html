<style>
  /* Bento Grid Styling */
  .shop-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
  }
  .product-card {
    background: #1a1a1a;
    color: white;
    padding: 24px;
    border-radius: 16px;
    border: 1px solid #333;
    transition: transform 0.2s;
  }
  .product-card:hover { transform: scale(1.02); }
  .cart-header { text-align: center; margin-bottom: 40px; }
</style>

<div class="cart-header">
  <h1>BeaTrackFam Checkout</h1>
  <p>Secure payment processed by Stripe</p>
</div>

<div class="shop-container">
  <!-- Mug Product Card -->
  <div class="product-card">
    <img src="YOUR_MUG_IMAGE.jpg" width="100%" style="border-radius: 8px;">
    <h2>Sunflower Signature Mug</h2>
    <p>Premium ceramic, available in 11oz and 15oz.</p>
    
    <!-- PASTE YOUR STRIPE BUY BUTTON CODE BELOW -->
    <script async src="https://js.stripe.com/v3/buy-button.js"></script>
    <stripe-buy-button
      buy-button-id="YOUR_ID_HERE"
      publishable-key="YOUR_KEY_HERE">
    </stripe-buy-button>
  </div>
</div>
