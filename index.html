<div id="paypal-button-container" style="max-width: 400px; margin: auto;"></div>

<!-- Include the PayPal JavaScript SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=[YOUR_PAYPAL_CLIENT_ID]&currency=USD&buyer-country=US"></script>

<script>
  paypal.Buttons({
    createOrder: function(data, actions) {
      // This pulls the price based on the variant selected in your UI
      return actions.order.create({
        purchase_units: [{
          amount: {
            value: '[SELECTED_PRICE_E.G._29.99]' 
          },
          description: '[PRODUCT_NAME_E.G._SUNFLOWER_MUG]'
        }]
      });
    },
    onApprove: function(data, actions) {
      return actions.order.capture().then(function(details) {
        alert('Transaction completed by ' + details.payer.name.given_name);
        window.location.href = "/success"; 
      });
    }
  }).render('#paypal-button-container');
</script>
